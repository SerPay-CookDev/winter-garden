<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Зимний сад</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- Библиотеки -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="desktop-showcase">
    <!-- Контейнер-смартфон -->
    <div class="app-container" id="app">

        <!-- ГЛАВНЫЙ ЭКРАН -->
        <div id="main-screen" class="screen active">
            <header class="header">
                <button class="icon-btn" id="settings-btn" title="Настройки">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/>
                        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
                    </svg>
                </button>

                <h1 class="title">Зимний сад</h1>

                <button class="icon-btn add-btn" id="add-plant-btn" title="Добавить растение">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                </button>
            </header>

            <div id="vacation-banner" class="vacation-banner hidden">
                🌴 Режим «Отпуск» включен. Уведомления отключены.
            </div>

            <h2 class="section-title">Мои растения</h2>
            <div class="plant-list" id="plant-list">
                <!-- Карточки растений добавляются через JavaScript -->
            </div>
        </div>

        <!-- ЭКРАН ПРОСМОТРА РАСТЕНИЯ -->
        <div id="detail-screen" class="screen">
            <div class="detail-photo-area" id="detail-photo-area">
                <button class="icon-btn close-btn" id="close-detail-btn" title="Назад">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>

                <img id="detail-img" src="" alt="Растение">
            </div>

            <div class="detail-info-area">
                <h2 id="detail-name" class="detail-title">Название</h2>

                <div class="metrics-grid">
                    <div class="metric-card">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                            <line x1="16" y1="2" x2="16" y2="6"/>
                            <line x1="8" y1="2" x2="8" y2="6"/>
                            <line x1="3" y1="10" x2="21" y2="10"/>
                        </svg>
                        <div>
                            <div class="metric-label">ПОЛИВ</div>
                            <div class="metric-value" id="detail-watering">1 / нед</div>
                        </div>
                    </div>

                    <div class="metric-card">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2.69l5.66 5.66a8 8 0 11-11.31 0z"/>
                        </svg>
                        <div>
                            <div class="metric-label">ОСВЕЩЕНИЕ</div>
                            <div class="metric-value" id="detail-light">Яркий свет</div>
                        </div>
                    </div>

                    <div class="metric-card">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 14.76V3.5a2.5 2.5 0 00-5 0v11.26a4.5 4.5 0 105 0z"/>
                        </svg>
                        <div>
                            <div class="metric-label">ТЕМПЕРАТУРА</div>
                            <div class="metric-value" id="detail-temp">15-24 °C</div>
                        </div>
                    </div>

                    <div class="metric-card">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2.69l5.66 5.66a8 8 0 11-11.31 0z"/>
                            <line x1="12" y1="18" x2="12" y2="22"/>
                        </svg>
                        <div>
                            <div class="metric-label">ВЛАЖНОСТЬ</div>
                            <div class="metric-value" id="detail-hum">40-60 %</div>
                        </div>
                    </div>
                </div>

                <div id="recommendation-box" class="recommendation-box hidden">
                    <strong>Внимание!</strong>
                    <span id="recommendation-text"></span>
                </div>

                <div class="chart-container">
                    <canvas id="climateChart"></canvas>
                </div>

                <div class="action-buttons">
                    <button class="primary-btn" id="emulate-sensor-btn">📡 Эмулировать датчик</button>
                    <button class="secondary-btn" id="delete-plant-btn">Удалить растение</button>
                </div>
            </div>
        </div>

        <!-- МОДАЛЬНОЕ ОКНО ДОБАВЛЕНИЯ РАСТЕНИЯ -->
        <div id="add-modal" class="modal hidden">
            <div class="modal-content">
                <h2>Новое растение</h2>

                <form id="add-plant-form">
                    <label for="plant-search">Найдите растение в каталоге</label>
                    <input
                        type="search"
                        id="plant-search"
                        placeholder="Начните вводить название"
                        autocomplete="off"
                    >

                    <div id="plant-search-results" class="plant-search-results"></div>

                    <button
                        type="button"
                        id="manual-plant-btn"
                        class="secondary-btn hidden"
                    >
                        Не нашли? Добавить вручную
                    </button>

                    <div id="manual-plant-fields" class="hidden">
                        <input
                            type="text"
                            id="new-name"
                            placeholder="Название растения"
                        >
                        <input
                            type="url"
                            id="new-photo"
                            placeholder="Ссылка на фото (URL)"
                        >
                    </div>

                    <div class="form-row">
                        <input type="number" id="new-temp-min" placeholder="Мин. t°C" required>
                        <input type="number" id="new-temp-max" placeholder="Макс. t°C" required>
                    </div>

                    <div class="form-row">
                        <input type="number" id="new-hum-min" placeholder="Мин. влаж. %" required>
                        <input type="number" id="new-hum-max" placeholder="Макс. влаж. %" required>
                    </div>

                    <div class="form-row">
                        <input type="number" id="new-watering" placeholder="Полив (раз в неделю)" required>
                        <select id="new-light">
                            <option value="Тень">Тень</option>
                            <option value="Рассеянный свет">Рассеянный свет</option>
                            <option value="Яркий свет">Яркий свет</option>
                        </select>
                    </div>

                    <div class="modal-actions">
                        <button type="button" class="secondary-btn" id="cancel-add-btn">Отмена</button>
                        <button type="submit" class="primary-btn">Добавить</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- МОДАЛЬНОЕ ОКНО НАСТРОЕК -->
        <div id="settings-modal" class="modal hidden">
            <div class="modal-content">
                <h2>Настройки</h2>

                <div class="setting-item">
                    <label for="vacation-toggle">Режим «Отпуск»</label>
                    <input type="checkbox" id="vacation-toggle">
                </div>

                <p class="setting-desc">
                    Отключает все уведомления и рекомендации на время отсутствия.
                </p>

                <div class="modal-actions" style="margin-top: 20px;">
                    <button type="button" class="primary-btn" id="close-settings-btn">Готово</button>
                </div>
            </div>
        </div>
    </div>

    <div class="promo-text" aria-live="polite">
        <span id="promo-message">Скачайте сегодня</span>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
